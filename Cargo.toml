[package]
name = "ui-slint"
version = "0.7.0"
edition = "2021"

[dependencies]
# No default features: we pick the window backend with our own features below.
# femtovg draws with OpenGL ES 2, which the Pi 3 GPU (vc4) has.
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# history plots read frequency_data.db directly; "bundled" builds SQLite itself, so the Pi needs no libsqlite3
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
# PC (Kali): a normal window under X11/Wayland.   cargo run --release
# Pi (no desktop): straight to the screen via DRM/KMS, touch via libinput.
#                 cargo build --release --no-default-features --features kms
default = ["desktop"]
desktop = ["slint/backend-winit"]
kms = ["slint/backend-linuxkms-noseat", "slint/renderer-software"]

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
